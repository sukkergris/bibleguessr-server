name: bibleguessr-production

services:
  nginx:
    image: docker.io/isuperman/bibleguessr-nginx:${VERSION:?VERSION must be set (load env/app.env)}
    logging:
      driver: ${NGINX_LOGGING_DRIVER:-json-file}
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ${LETSENCRYPT_CHALLENGES_DIR:?LETSENCRYPT_CHALLENGES_DIR must be set (load env/letsencrypt.env)}:/var/www/letsencrypt_challenges
      - ${LETSENCRYPT_DIR:?LETSENCRYPT_DIR must be set (load env/letsencrypt.env)}:/etc/letsencrypt:ro
      - ${NGINX_DIR:?NGINX_DIR must be set (load env/nginx.env)}:/etc/nginx
    # env_file:
    #   - ./env/nginx.env
    #   - ./env/app.env
    #   - ./env/letsencrypt.env
    # # depends_on:
    # #   - web-api
    # #   - yarp
    networks:
      - bibleguessr-prod
      - vaultwarden
    restart: unless-stopped

  bibleguessr-api:
    image: docker.io/isuperman/bibleguessr-api:${VERSION:?VERSION must be set (load env/app.env)}
    env_file:
      - ./env/bibleguessr/brevo.env
      - ./env/bibleguessr/webapi.env
      - ./env/app.env
    volumes:
      # Named volume (not a bind mount): a fresh volume inherits apiuser's
      # (UID 1000) ownership from the image. The API unpacks the Bible archive here.
      - bible-data:/data/bibles
      - game-db:/data/db
    networks:
      - bibleguessr-prod
    restart: unless-stopped

  vaultwarden:
    depends_on:
      - nginx
    image: docker.io/vaultwarden/server:${VAULTWARDEN_VERSION:-latest}
    # Kept in a subfolder: env/*.env are all sourced by process_templates, and
    # vaultwarden's DOMAIN would clash with the one in env/nginx.env.
    env_file:
      - ./env/vaultwarden/vaultwarden.env
    volumes:
      - vaultwarden-data:/data
    # No published ports: reached only through nginx.
    networks:
      - vaultwarden
    restart: unless-stopped

volumes:
  bible-data:
  game-db:
  vaultwarden-data:

networks:
  # Separate from bibleguessr-prod so vaultwarden gets no address in the
  # subnet the API trusts for X-Forwarded-For. Only nginx joins both.
  vaultwarden:
    driver: bridge

  bibleguessr-prod:
    driver: bridge
    # Fixed subnet: the API trusts X-Forwarded-For only from this network
    # (ForwardedHeadersOptions.KnownIPNetworks). Change both together.
    ipam:
      config:
        - subnet: 10.201.0.0/24
