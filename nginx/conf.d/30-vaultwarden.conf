# Vaultwarden on its own host name, so it never shares an origin (cookies,
# storage, CSP) with the BibleGuessr SPA.
#
# Logged with realip_noquery: the clients put their bearer token in the query
# string of /notifications/hub, so query strings must stay out of the log.

# HTTP redirect
server {
    listen 80;
    access_log /dev/stdout realip_noquery;
    server_name vault.bibleguessr.srv;

    if ($bad_guys = 1) {
        return 302 $scheme://$host$request_uri;
    }

    include includes/tarpit.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt_challenges;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    access_log /dev/stdout realip_noquery;
    server_name vault.bibleguessr.srv;

    if ($bad_guys = 1) {
        return 302 $scheme://$host$request_uri;
    }

    include includes/tarpit.conf;

    ssl_certificate /etc/letsencrypt/live/vault.bibleguessr.srv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault.bibleguessr.srv/privkey.pem;
    include includes/ssl-params.conf;

    # Bitwarden allows attachments up to 500 MB (plus encryption overhead).
    client_max_body_size 525M;

    # Password logins and token refreshes. Vaultwarden also rate limits logins
    # itself (keyed on X-Real-IP from proxy-params.conf); this stops floods
    # before they reach it.
    location = /identity/connect/token {
        limit_req zone=vault_login burst=10 nodelay;
        limit_req_status 429;
        include includes/proxy-vaultwarden.conf;
    }

    # Admin panel (disabled while ADMIN_TOKEN is empty).
    location ^~ /admin {
        limit_req zone=vault_login burst=20 nodelay;
        limit_req_status 429;
        include includes/proxy-vaultwarden.conf;
    }

    # Everything else, including the /notifications/hub WebSocket. Long
    # timeouts keep idle live-sync connections open.
    location / {
        include includes/proxy-vaultwarden.conf;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
