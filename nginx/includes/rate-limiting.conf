# No CDN in front: nginx is the edge, so $remote_addr is the real client IP.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Report endpoints send email, so they get a much stricter per-IP limit.
limit_req_zone $binary_remote_addr zone=report_limit:10m rate=5r/m;

# Vaultwarden logins and admin panel: brute-force protection.
limit_req_zone $binary_remote_addr zone=vault_login:10m rate=10r/m;
