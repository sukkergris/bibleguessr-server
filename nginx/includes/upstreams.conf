# Upstreams for proxied services. proxy_pass uses these variables, so the
# resolver in http-globals.conf looks the names up per request and nginx
# still starts when a backend container is down.
map $host $api_upstream {
    default "http://bibleguessr-api:8080";
}

# Connection header for WebSocket upgrades (used by proxy-websocket.conf).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
