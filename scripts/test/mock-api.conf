# Mock upstream for nginx-routing.sh: echoes what nginx forwarded. Port 8080
# stands in for the BibleGuessr API, port 80 for Vaultwarden.
server {
    listen 8080;
    listen 80;
    client_max_body_size 0;
    location / {
        default_type text/plain;
        return 200 "method=$request_method uri=$request_uri upgrade=$http_upgrade connection=$http_connection xff=$http_x_forwarded_for proto=$http_x_forwarded_proto port=$server_port\n";
    }
}
