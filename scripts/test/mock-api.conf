# Mock BibleGuessr API for nginx-routing.sh: echoes what nginx forwarded.
server {
    listen 8080;
    location / {
        default_type text/plain;
        return 200 "method=$request_method uri=$request_uri upgrade=$http_upgrade connection=$http_connection xff=$http_x_forwarded_for proto=$http_x_forwarded_proto\n";
    }
}
