version: '3'

vars:
  COMPOSE_CMD: docker compose --env-file env/app.env --env-file env/nginx.env --env-file env/letsencrypt.env --env-file env/bibleguessr/webapi.env --env-file .env -f docker-compose.yml -p bibleguessr-production
  APP_VERSION: 0.0.5

tasks:
  docker:list-volumes:
    desc: "List all Docker volumes"
    cmds:
    - docker volume ls

  site:pull:
    desc: "Pull the application images used by the app stack"
    cmds:
      - docker pull docker.io/isuperman/bibleguessr-nginx:{{ .APP_VERSION }}
      - docker pull docker.io/isuperman/bibleguessr-api:{{ .APP_VERSION }}

  site:down:
    desc: "Stop the full app stack"
    cmds:
      - "{{.COMPOSE_CMD}} down"
    interactive: true

  site:up:
    desc: "Start the full app stack"
    deps: [nginx:generate-conf]
    # deps: [preflight-check]
    cmds:
      - "{{.COMPOSE_CMD}} up -d"
    interactive: true

  nginx:generate-conf:
    desc: "Generate nginx conf files from templates"
    cmds:
      - ./scripts/initialize-nginx-conf.sh
    interactive: true

  nginx:test:
    desc: "Run the nginx routing test against a mock API (does not touch the running stack)"
    deps: [nginx:generate-conf]
    cmds:
      - APP_VERSION={{ .APP_VERSION }} ./scripts/test/nginx-routing.sh
  
  list:names:
    cmds:
      - docker ps --format '{{.Names}}'
