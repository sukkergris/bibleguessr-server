server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name bibleguessr.uk www.bibleguessr.uk;

  ssl_certificate /etc/letsencrypt/live/bibleguessr.uk/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bibleguessr.uk/privkey.pem;

  location = / {
    default_type text/plain;
    return 200 "HTTPS test OK (bibleguessr.uk)\n";
  }

  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt_challenges;
  }
}
