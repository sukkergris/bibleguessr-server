# Minimal nginx config for Let's Encrypt ACME HTTP-01 challenge

server {
  listen 80;
  server_name kforkode.dk www.kforkode.dk habibi-vip-taxi.com www.habibi-vip-taxi.com carstens-vinduespolering.dk www.carstens-vinduespolering.dk;

  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt_challenges;
  }

  location = / {
    default_type text/plain;
    return 200 "ACME bootstrap nginx is running\n";
