# HTTPS test block for habibi-vip-taxi.com
#
# IMPORTANT:
# - Keep this block COMMENTED OUT until certbot has created:
#   /etc/letsencrypt/live/habibi-vip-taxi.com/fullchain.pem
#   /etc/letsencrypt/live/habibi-vip-taxi.com/privkey.pem
# - Uncomment this block only after certs exist.
# - If cert files are missing and this block is enabled, nginx will fail to start.
#
# Suggested flow:
# 1) Run cert issuance/dry-run tasks with HTTP-01 (port 80).
# 2) Verify cert files exist for habibi-vip-taxi.com.
# 3) Enable this 443 block and reload/restart nginx.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name habibi-vip-taxi.com www.habibi-vip-taxi.com;

  ssl_certificate /etc/letsencrypt/live/habibi-vip-taxi.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/habibi-vip-taxi.com/privkey.pem;

  location = / {
    default_type text/plain;
    return 200 "HTTPS test OK (habibi-vip-taxi)\n";
  }

  location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt_challenges;
  }
}